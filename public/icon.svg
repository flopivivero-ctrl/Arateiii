<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F6B3F" />
      <stop offset="100%" stop-color="#284828" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BC7D" />
      <stop offset="100%" stop-color="#B3934B" />
    </linearGradient>
  </defs>
  <!-- Background with subtle squircle shape -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Outer decorative circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 6" />
  <!-- Inner medallion -->
  <circle cx="256" cy="256" r="150" fill="#243F24" />
  <!-- Elegant Arateii Monogram 'A' -->
  <text x="256" y="325" font-family="'Playfair Display', Georgia, serif" font-size="200" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">A</text>
  <text x="256" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#F7F8F3" text-anchor="middle" opacity="0.9">ARATEII</text>
</svg>
